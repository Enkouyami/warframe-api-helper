[package]
name = "warframe-api-helper"
version = "2.0.0"
edition = "2021"
authors = ["Obsidian Jackal"]
description = "Scan the running Warframe process for session credentials and download inventory"
license = "BSD-3-Clause"
repository = "https://github.com/Obsidian-Jackal/warframe-api-helper"

[[bin]]
name = "warframe-api-helper"
path = "src/main.rs"

[dependencies]
# HTTP client (reqwest + rustls-tls)
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encryption
aes = "0.8"
cbc = "0.1"
generic-array = "0.14"
argon2 = "0.5"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File I/O
walkdir = "2.4"

# String utilities
regex = "1.10"

# Terminal detection
atty = "0.2"

# Process memory access
# Windows
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "memoryapi", "processthreadsapi", "handleapi", "errhandlingapi"] }

# Linux
[target.'cfg(unix)'.dependencies]
procfs = "0.16"
nix = "0.28"

[profile.release]
opt-level = "z"        # Optimize for size instead of speed
lto = true             # Link-time optimization (can reduce size)
codegen-units = 1      # Better optimization (slower compile, smaller binary)
panic = "abort"        # Smaller panic handling (no unwinding code)
strip = true           # Automatically strip debug symbols
